<rect width="1000" height="850" fill="#f7f2eb"/><text x="55" y="60" class="t">Patak – méretezett alaprajz</text><text x="55" y="92" class="s">Bruttó kabinalapterület: 16,90 m² • befoglaló méret: 5,000 × 4,000 m • L alakú udvaros alaprajz</text><polygon points="125,165 407.9,165 407.9,329.0 535.0,329.0 535.0,493.0 125,493.0" class="wall"/><rect x="137" y="177" width="258.90000000000003" height="127.10000000000001" class="room"/><text x="266.45000000000005" y="235" text-anchor="middle" class="label">Nappali + háló</text><text x="266.45000000000005" y="259" text-anchor="middle" class="small">8,95 m²</text><rect x="137" y="306.03999999999996" width="110.7" height="135.29999999999998" class="room"/><text x="192.35" y="373.68999999999994" text-anchor="middle" class="label">Fürdő</text><text x="192.35" y="395.68999999999994" text-anchor="middle" class="small">2,23 m²</text><rect x="252.10000000000002" y="329.0" width="270.90000000000003" height="82.0" class="room"/><text x="387.40000000000003" y="376.56" text-anchor="middle" class="label">Konyha + étkező</text><text x="387.40000000000003" y="397.06" text-anchor="middle" class="small">3,25 m²</text><rect x="415.9" y="173" width="111.10000000000001" height="148.0" class="terrace"/><text x="471.45" y="247.0" text-anchor="middle" class="label">Privát udvar</text><line x1="125" y1="137" x2="535.0" y2="137" class="dim"/><text x="330.0" y="128" text-anchor="middle" class="dtext">5,000 m</text><line x1="85" y1="165" x2="85" y2="493.0" class="dim"/><text x="100" y="329.0" transform="rotate(90 100 329.0)" text-anchor="middle" class="dtext">4,000 m</text><text x="55" y="810" class="small">Az L alakú tömeg bruttó területe pontosan 16,90 m²: 5,00 × 4,00 m befoglaló téglalap mínusz 1,55 × 2,00 m udvari kivágás.</text></svg>