<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .t{font-size:34px;font-weight:800} .s{font-size:18px;fill:#6d625d}
.wall{fill:#efe4d7;stroke:#171312;stroke-width:8} .room{fill:#fff;stroke:#776961;stroke-width:2}
.dim{stroke:#c33a20;stroke-width:2;marker-start:url(#a);marker-end:url(#a)} .dtext{font-size:17px;font-weight:700;fill:#b7341e}
.label{font-size:19px;font-weight:800} .small{font-size:14px;fill:#554943} .furn{fill:#d7c2ac;stroke:#806852;stroke-width:1.5}
.terrace{fill:#d2b48c;stroke:#8a6c4e;stroke-width:2;stroke-dasharray:7 5} .sauna{fill:#b98455;stroke:#6f4728;stroke-width:3}
</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M8 4L0 0L0 8Z" fill="#c33a20"/></marker></defs>
<rect width="1000" height="720" fill="#f7f2eb"/><text x="55" y="60" class="t">Kilátó – méretezett alaprajz</text><text x="55" y="92" class="s">Kétszintes lombház • bruttó összterület: 15,85 m² • szintenként 7,925 m² • külső méret: 2,500 × 3,170 m</text><rect x="105" y="180" width="312.5" height="396.25" class="wall"/><rect x="270.0" y="190" width="137.5" height="193.75" class="room"/><text x="338.75" y="265" text-anchor="middle" class="label">Fürdő</text><text x="338.75" y="288" text-anchor="middle" class="small">1,70 m²</text><text x="230.0" y="437.5625" text-anchor="middle" class="label">Hálótér</text><text x="230.0" y="461.5625" text-anchor="middle" class="small">3,64 m²</text><text x="261.25" y="156" text-anchor="middle" class="label">Alsó szint</text><line x1="105" y1="611.25" x2="417.5" y2="611.25" class="dim"/><text x="261.25" y="602.25" text-anchor="middle" class="dtext">2,500 m</text><line x1="75" y1="180" x2="75" y2="576.25" class="dim"/><text x="90" y="378.125" transform="rotate(90 90 378.125)" text-anchor="middle" class="dtext">3,170 m</text><rect x="545" y="180" width="312.5" height="396.25" class="wall"/><text x="701.25" y="370.2" text-anchor="middle" class="label">Pihenőtér</text><text x="701.25" y="396.2" text-anchor="middle" class="small">5,34 m²</text><text x="701.25" y="156" text-anchor="middle" class="label">Felső szint</text><line x1="545" y1="611.25" x2="857.5" y2="611.25" class="dim"/><text x="701.25" y="602.25" text-anchor="middle" class="dtext">2,500 m</text><line x1="515" y1="180" x2="515" y2="576.25" class="dim"/><text x="530" y="378.125" transform="rotate(90 530 378.125)" text-anchor="middle" class="dtext">3,170 m</text><text x="55" y="676" class="small">A két szint azonos külső kontúrral készül; a felső szint kapcsolódik a külön wellness-teraszhoz és a 4,00 m²-es szaunamodulhoz.</text></svg>