<rect width="1000" height="720" fill="#f7f2eb"/><text x="55" y="60" class="t">Mogyoró – méretezett alaprajz</text><text x="55" y="92" class="s">Bruttó kabinalapterület: 13,13 m² • külső méret: 2.990 × 4.390 m • 8,00 m² terasz + 4,00 m² szaunamodul</text><rect x="246.97038724373576" y="160.0" width="286.0592255125285" height="420.0" class="wall"/><rect x="408.2232346241458" y="170.0" width="114.80637813211845" height="167.4259681093394" class="room"/><text x="465.626423690205" y="248.7129840546697" text-anchor="middle" class="label">Fürdő</text><text x="465.626423690205" y="271.71298405466973" text-anchor="middle" class="small">2,10 m²</text><rect x="266.9703872437358" y="180.0" width="119.58997722095673" height="52.61958997722096" class="furn"/><text x="326.76537585421414" y="211.3097949886105" text-anchor="middle" class="small">Konyha</text><rect x="271.9703872437358" y="384.0" width="148.29157175398635" height="168.0" rx="6" class="furn"/><text x="346.11617312072894" y="473.0" text-anchor="middle" class="small">ágy</text><rect x="401.29840546697034" y="469.44" width="95" height="45" rx="8" class="furn"/><text x="390.0" y="402.0" text-anchor="middle" class="label">Nappali + háló</text><text x="390.0" y="426.0" text-anchor="middle" class="small">7,59 m²</text><line x1="452.9330296127563" y1="580.0" x2="501.5630979498861" y2="580.0" stroke="#f7f2eb" stroke-width="12"/><path d="M452.9330296127563,580.0 A48.63006833712985,48.63006833712985 0 0 1 501.5630979498861,531.3699316628702" fill="none" stroke="#17212b" stroke-width="2"/><rect x="198.65603644646924" y="602.0" width="382.6879271070615" height="191.34396355353076" class="terrace"/><text x="390.0" y="697.6719817767654" text-anchor="middle" class="label">Terasz · 8,00 m²</text><rect x="578.0296127562642" y="388.6560364464692" width="191.34396355353076" height="191.34396355353076" class="sauna"/><text x="673.7015945330296" y="480.3280182232346" text-anchor="middle" class="label">Szauna</text><text x="673.701594533029