<rect width="1000" height="720" fill="#f7f2eb"/><text x="55" y="60" class="t">Lomb – méretezett alaprajz</text><text x="55" y="92" class="s">Bruttó kabinalapterület: 16,40 m² • külső méret: 4.000 × 4.100 m • 8,00 m² terasz + 4,00 m² szaunamodul</text><rect x="185.12195121951217" y="160.0" width="409.75609756097566" height="420.0" class="wall"/><rect x="446.5853658536585" y="170.0" width="138.2926829268293" height="179.26829268292684" class="room"/><text x="515.7317073170732" y="254.6341463414634" text-anchor="middle" class="label">Fürdő</text><text x="515.7317073170732" y="277.6341463414634" text-anchor="middle" class="small">2,36 m²</text><rect x="205.12195121951217" y="180.0" width="128.0487804878049" height="56.341463414634156" class="furn"/><text x="269.1463414634146" y="213.1707317073171" text-anchor="middle" class="small">Konyha</text><rect x="210.12195121951217" y="384.0" width="158.78048780487808" height="168.0" rx="6" class="furn"/><text x="289.5121951219512" y="473.0" text-anchor="middle" class="small">ágy</text><rect x="458.42682926829264" y="469.44" width="95" height="45" rx="8" class="furn"/><text x="390.0" y="402.0" text-anchor="middle" class="label">Nappali + háló</text><text x="390.0" y="426.0" text-anchor="middle" class="small">10,24 m²</text><line x1="480.1463414634146" y1="580.0" x2="549.8048780487806" y2="580.0" stroke="#f7f2eb" stroke-width="12"/><path d="M480.1463414634146,580.0 A69.65853658536587,69.65853658536587 0 0 1 549.8048780487806,510.3414634146341" fill="none" stroke="#17212b" stroke-width="2"/><rect x="185.12195121951217" y="602.0" width="409.75609756097566" height="204.87804878048783" class="terrace"/><text x="390.0" y="704.439024390244" text-anchor="middle" class="label">Terasz · 8,00 m²</text><rect x="639.8780487804878" y="375.1219512195122" width="204.87804878048783" height="204.87804878048783" class="sauna"/><text x="742.3170731707318" y="473.5609756097561" text-anchor="middle" class="label">Szauna</text><text x="742.3170731707318" y="497.5609756097561" text-anchor="middle" class="small">4,00 m²</text><line x1="185.12195121951217" y1="132.0" x2="594.8780487804878" y2="132.0" class="dim"/><text x="390.0" y="123.0" text-anchor="middle" class="dtext">4.000 m</text><line x1="145.12195121951217" y1="160.0" x2="145.12195121951217" y2="580.0" class="dim"/><text x="160.12195121951217" y="370.0" transform="rotate(90 160.12195121951217 370.0)" text-anchor="middle" class="dtext">4.100 m</text><text x="55" y="676" class="small">Külső méretek és helyiségméretek az értékesítési alaprajz szerint. A terasz és a szaunamodul nem része a bruttó kabinalapterületnek.</text></svg>