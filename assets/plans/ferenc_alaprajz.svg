<rect width="1000" height="720" fill="#f7f2eb"/><text x="55" y="60" class="t">Ferenc – méretezett alaprajz</text><text x="55" y="92" class="s">Bruttó kabinalapterület: 13,84 m² • külső méret: 3.200 × 4.325 m • 8,00 m² terasz + 4,00 m² szaunamodul</text><rect x="234.6242774566474" y="160.0" width="310.7514450867052" height="420.0" class="wall"/><rect x="418.84393063583815" y="170.0" width="116.53179190751445" height="165.08670520231212" class="room"/><text x="477.1098265895954" y="247.54335260115607" text-anchor="middle" class="label">Fürdő</text><text x="477.1098265895954" y="270.5433526011561" text-anchor="middle" class="small">2,04 m²</text><rect x="254.6242774566474" y="180.0" width="121.38728323699422" height="53.41040462427746" class="furn"/><text x="315.3179190751445" y="211.70520231213874" text-anchor="middle" class="small">Konyha</text><rect x="259.6242774566474" y="384.0" width="150.52023121387282" height="168.0" rx="6" class="furn"/><text x="334.88439306358384" y="473.0" text-anchor="middle" class="small">ágy</text><rect x="412.6416184971098" y="469.44" width="95" height="45" rx="8" class="furn"/><text x="390.0" y="402.0" text-anchor="middle" class="label">Nappali + háló</text><text x="390.0" y="426.0" text-anchor="middle" class="small">8,29 m²</text><line x1="458.3653179190751" y1="580.0" x2="511.19306358381505" y2="580.0" stroke="#f7f2eb" stroke-width="12"/><path d="M458.3653179190751,580.0 A52.827745664739886,52.827745664739886 0 0 1 511.19306358381505,527.1722543352602" fill="none" stroke="#17212b" stroke-width="2"/><rect x="195.78034682080926" y="602.0" width="388.4393063583815" height="194.21965317919074" class="terrace"/><text x="390.0" y="699.1098265895954" text-anchor="middle" class="label">Terasz · 8,00 m²</text><rect x="590.3757225433526" y="385.78034682080926" width="194.21965317919074" height="194.21965317919074" class="sauna"/><text x="687.485549132948" y="478.8901734104046" text-anchor="middle" class="label">Szauna</text><text x="687.485549132948" y="502.8901734104046" text-anchor="middle" class="small">4,00 m²</text><line x1="234.6242774566474" y1="132.0" x2="545.3757225433526" y2="132.0" class="dim"/><text x="390.0" y="123.0" text-anchor="middle" class="dtext">3.200 m</text><line x1="194.6242774566474" y1="160.0" x2="194.6242774566474" y2="580.0" class="dim"/><text x="209.6242774566474" y="370.0" transform="rotate(90 209.6242774566474 370.0)" text-anchor="middle" class="dtext">4.325 m</text><text x="55" y="676" class="small">Külső méretek és helyiségméretek az értékesítési alaprajz szerint. A terasz és a szaunamodul nem része a bruttó kabinalapterületnek.</text></svg>