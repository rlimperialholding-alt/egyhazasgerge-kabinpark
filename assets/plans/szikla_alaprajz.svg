<rect width="1000" height="850" fill="#f7f2eb"/><text x="55" y="60" class="t">Szikla – méretezett alaprajz</text><text x="55" y="92" class="s">Bruttó kabinalapterület: 16,05 m² • külső méret: 3.210 × 5.000 m • 8,00 m² terasz + 4,00 m² szaunamodul</text><rect x="255.18" y="160.0" width="269.64" height="420.0" class="wall"/><rect x="409.81999999999994" y="170.0" width="105.0" height="147.0" class="room"/><text x="462.31999999999994" y="238.5" text-anchor="middle" class="label">Fürdő</text><text x="462.31999999999994" y="261.5" text-anchor="middle" class="small">2,19 m²</text><rect x="275.18" y="180.0" width="105.0" height="46.2" class="furn"/><text x="327.68" y="208.1" text-anchor="middle" class="small">Konyha</text><rect x="280.18" y="384.0" width="130.20000000000002" height="168.0" rx="6" class="furn"/><text x="345.28000000000003" y="473.0" text-anchor="middle" class="small">ágy</text><rect x="401.2299999999999" y="469.44" width="95" height="45" rx="8" class="furn"/><text x="390.0" y="402.0" text-anchor="middle" class="label">Nappali + háló</text><text x="390.0" y="426.0" text-anchor="middle" class="small">10,01 m²</text><line x1="449.32079999999996" y1="580.0" x2="495.1596" y2="580.0" stroke="#f7f2eb" stroke-width="12"/><path d="M449.32079999999996,580.0 A45.8388,45.8388 0 0 1 495.1596,534.1612" fill="none" stroke="#17212b" stroke-width="2"/><rect x="222.0" y="602.0" width="336.0" height="168.0" class="terrace"/><text x="390.0" y="686.0" text-anchor="middle" class="label">Terasz · 8,00 m²</text><rect x="569.8199999999999" y="412.0" width="168.0" height="168.0" class="sauna"/><text x="653.8199999999999" y="492.0" text-anchor="middle" class="label">Szauna</text><text x="653.8199999999999" y="516.0" text-anchor="middle" class="small">4,00 m²</text><line x1="255.18" y1="132.0" x2="524.8199999999999" y2="132.0" class="dim"/><text x="390.0" y="123.0" text-anchor="middle" class="dtext">3.210 m</text><line x1="215.18" y1="160.0" x2="215.18" y2="580.0" class="dim"/><text x=