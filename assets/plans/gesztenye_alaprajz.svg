<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .t{font-size:34px;font-weight:800} .s{font-size:18px;fill:#6d625d}
.wall{fill:#efe4d7;stroke:#171312;stroke-width:8} .room{fill:#fff;stroke:#776961;stroke-width:2}
.dim{stroke:#c33a20;stroke-width:2;marker-start:url(#a);marker-end:url(#a)} .dtext{font-size:17px;font-weight:700;fill:#b7341e}
.label{font-size:19px;font-weight:800} .small{font-size:14px;fill:#554943} .furn{fill:#d7c2ac;stroke:#806852;stroke-width:1.5}
.terrace{fill:#d2b48c;stroke:#8a6c4e;stroke-width:2;stroke-dasharray:7 5} .sauna{fill:#b98455;stroke:#6f4728;stroke-width:3}
</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M8 4L0 0L0 8Z" fill="#c33a20"/></marker></defs>
<rect width="1000" height="720" fill="#f7f2eb"/><text x="55" y="60" class="t">Gesztenye – méretezett alaprajz</text><text x="55" y="92" class="s">Bruttó kabinalapterület: 18,20 m² • két 8,40 m²-es tömeg + 1,40 m² üvegezett összekötő</text><rect x="95" y="190" width="204.0" height="297.5" class="wall"/><rect x="418.0" y="190" width="204.0" height="297.5" class="wall"/><rect x="299.0" y="296.25" width="118.99999999999999" height="85" class="wall"/><text x="197.0" y="280" text-anchor="middle" class="label">Nappali + konyha</text><text x="197.0" y="306" text-anchor="middle" class="small">6,20 m²</text><text x="520.0" y="280" text-anchor="middle" class="label">Hálótér</text><text x="520.0" y="306" text-anchor="middle" class="small">5,80 m²</text><rect x="433.0" y="352.5" width="95" height="120" class="room"/><text x="480.0" y="409.5" text-anchor="middle" class="label">Fürdő</text><text x="480.0" y="433.5" text-anchor="middle" class="small">2,10 m²</text><text x="358.5" y="338.75" text-anchor="middle" class="small">üvegkapcsolat</text><line x1="95" y1="160" x2="622.0" y2="160" class="dim"/><text x="358.5" y="151" text-anchor="middle" class="dtext">6,200 m</text><line x1="57" y1="190" x2="57" y2="487.5" class="dim"/><text x="72" y="338.75" transform="rotate(90 72 338.75)" text-anchor="middle" class="dtext">3,500 m</text><text x="55" y="676" class="small">Két külön funkciójú nyeregtetős tömeg üvegezett összekötéssel; a bruttó terület 8,40 + 8,40 + 1,40 = 18,20 m².</text></svg>